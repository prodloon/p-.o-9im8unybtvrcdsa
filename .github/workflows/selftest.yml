name: selftest

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# The python battery is darwin-shaped end to end (launchctl in suite 7, BSD
# stat, a python spawner using start_new_session) and pins /usr/local/bin/node,
# so the runner must be macOS. Homebrew node is symlinked to that path rather
# than fighting the pin.
#
# ui/dist is gitignored but suite 5 asserts it, so CI runs the vite build
# first. Suite 5's cargo check gets a 600 s window inside the battery, so the
# Rust cache is warmed by an explicit cargo check before it runs.
#
# Suite 7 asserts "status exits 0 when the stack is up", so CI boots the real
# stack headless (--no-ui: orchestrator + telemetry-server only — no tauri
# shell, no cargo build, no vite).
#
# No OPENROUTER_API_KEY needed: suite 2 blanks it by design and suite 3's
# end-to-end task is file-io.
#
# The second job builds the real installer with NO_APP_VERIFY=1 (stage 5
# launches the installed app — no GUI on runners) so payload regressions —
# missing staged modules, broken wiring, a binary without the shell's proof
# line — fail the build, not the next local build. It mirrors the selftest
# job's toolchain steps.
#
# COST GATE: a full macOS tauri build burns ~5 billable minutes per run, so
# the installer job runs ONLY on version tags and manual dispatch. The cheap
# battery job (~1 min) gates every push/PR; the expensive build runs at the
# moments that produce artifacts people actually consume. A PR that would
# break the installer payload still can't break a release silently: the tag
# push runs the installer before any release artifacts exist, and
# workflow_dispatch lets you build-install on any branch before merging
# when the change touches packaging.

jobs:
  selftest:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Show preinstalled toolchain
        run: |
          node --version; python3 --version; cargo --version; bash --version | head -1

      - name: Set up Node (>=26 for node:sqlite)
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Pin node at /usr/local/bin/node (battery + clusterctl hardcode it)
        run: |
          set -euo pipefail
          NODE_BIN="$(command -v node)"
          echo "using node: $("$NODE_BIN" --version) at $NODE_BIN"
          sudo mkdir -p /usr/local/bin
          if [ -e /usr/local/bin/node ] && [ ! -L /usr/local/bin/node ]; then
            sudo mv /usr/local/bin/node /usr/local/bin/node.pre-daisy
          fi
          sudo ln -sf "$NODE_BIN" /usr/local/bin/node
          /usr/local/bin/node --version

      # macOS runners don't ship cargo preinstalled.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Suite 5 asserts ui/dist exists and contains a production build; it is
      # gitignored, so build it here. Lockfile (ui/package-lock.json) is tracked.
      - name: Build dashboard (ui/dist)
        run: |
          cd ui
          npm ci --no-audit --no-fund
          npm run build

      # Suite 5 runs `cargo check` with a 600 s timeout inside the battery —
      # warm the cache in the same target dir the battery will use. Cache
      # keyed on Cargo.lock + crates. A stale restored build dir can hold
      # references to files a newer tauri build script no longer emits
      # (tauri-*/out/permissions/*.toml gone missing) — clear that dir so
      # the build script regenerates it; registry/git caches stay warm.
      - name: Warm cargo cache (suite 5 has a 600 s timeout)
        run: |
          rm -rf target/debug/build/tauri-*
          cargo check
        working-directory: src-tauri
        timeout-minutes: 20

      - name: Secret-leak scan (S23 doctrine — full-shape keys never commit)
        run: node scripts/scan-secrets.js
      - name: Suite 1+2 — node batteries (governor + backend)
        run: |
          node governor/governor.selftest.js
          node backend/backend.selftest.js

      - name: Boot real stack headless (suite 3 + 4 + 7 drive it)
        run: |
          ./clusterctl.sh start --no-ui
          ./clusterctl.sh status

      - name: Suite 3-8 — python end-to-end battery
        run: python3 daisy_cluster_selftest.py

      - name: Tear down stack
        if: always()
        run: ./clusterctl.sh stop

      - name: Summarize failures
        if: failure()
        run: |
          echo "::group::orchestrator.log (tail)"
          tail -50 logs/orchestrator.log 2>/dev/null || echo "(no orchestrator.log)"
          echo "::endgroup::"
          echo "::group::telemetry.log (tail)"
          tail -50 logs/telemetry.log 2>/dev/null || echo "(no telemetry.log)"
          echo "::endgroup::"

  # ──────────────────────────────────────────────────────────────────────────
  # Installer build (payload regression gate). Mirrors the toolchain steps of
  # the selftest job above. Stage 5 of make-installer.sh is skipped here
  # (NO_APP_VERIFY=1): it launches the installed app, which needs a GUI
  # session — the static payload checks below substitute on CI.
  # ──────────────────────────────────────────────────────────────────────────
  installer:
    runs-on: macos-14
    timeout-minutes: 45
    # Cost gate: only version tags and manual runs (rationale above).
    # Deliberately NOT `needs: selftest` — the two jobs exercise different
    # things, and a tag shouldn't wait behind the battery to produce build
    # artifacts. The battery gates pushes; the release workflow gates tags
    # end-to-end.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (>=26 for node:sqlite)
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Pin node at /usr/local/bin/node (make-installer.sh hardcodes it)
        run: |
          set -euo pipefail
          NODE_BIN="$(command -v node)"
          sudo mkdir -p /usr/local/bin
          if [ -e /usr/local/bin/node ] && [ ! -L /usr/local/bin/node ]; then
            sudo mv /usr/local/bin/node /usr/local/bin/node.pre-daisy
          fi
          sudo ln -sf "$NODE_BIN" /usr/local/bin/node
          /usr/local/bin/node --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Stage 1 runs tauri build, whose beforeBuildCommand builds the UI —
      # both need ui/node_modules (tauri CLI + vite). Lockfile is tracked.
      - name: Install dashboard deps
        run: |
          cd ui
          npm ci --no-audit --no-fund

      - name: Disable updater artifacts if no signing key secret
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            python3 -c "import json; p='src-tauri/tauri.conf.json'; d=json.load(open(p)); d['bundle']['createUpdaterArtifacts']=False; json.dump(d, open(p,'w'), indent=2); print('updater artifacts disabled (no TAURI_SIGNING_PRIVATE_KEY secret)')"
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build installer (universal; stages 1–4, stage 5 skipped headless)
        run: NO_APP_VERIFY=1 TAURI_UNIVERSAL=1 ./make-installer.sh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # What stage 5 would prove on a GUI machine, asserted statically here:
      # the app-mode resolver modules are staged, the orchestrator is wired
      # to them, and the binary embeds the shell's emit-loop proof line.
      - name: Verify bundle payload
        run: |
          set -euo pipefail
          APP="/Applications/Daisy Cluster.app"
          APPDATA="$APP/Contents/Resources/appdata"
          codesign --verify --deep --strict "$APP"
          for f in backend/index.js backend/supervisor-root.js \
                   backend/supervisor-log-parser.js backend/backend.selftest.js \
                   skillbase/index.json; do
            test -f "$APPDATA/$f" || { echo "✗ missing $f"; exit 1; }
          done
          grep -q "resolveSupervisorRoot" "$APPDATA/backend/index.js"
          grep -q "rootSource" "$APPDATA/backend/index.js"
          grep -q "S18" "$APPDATA/backend/backend.selftest.js"
          grep -q "telemetry emit loop live" "$APP/Contents/MacOS/daisy-cluster"
          echo "✔ payload verified: modules staged, wiring present, proof line in binary"

      - name: Upload DMG + updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daisy-cluster-dmg
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: ignore
          retention-days: 7
