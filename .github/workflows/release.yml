# Release pipeline — tag-gated, fully automatic.
#
# Pushing a v* tag:
#   1. builds the installer via the same make-installer.sh stages CI uses
#      (tauri build → stage appdata → ad-hoc sign → swap binary), with the
#      updater signature applied at build time from
#      TAURI_SIGNING_PRIVATE_KEY (updater artifacts require it — if the
#      secret is missing the build FAILS here rather than shipping an
#      unsigned updater silently);
#   2. generates latest.json (the Tauri updater feed: version, platform,
#      signature, download URL) from the produced artifacts;
#   3. creates a GitHub release and attaches DMG + updater artifacts +
#      latest.json + SHA256SUMS.
#
# Installed apps poll the latest.json endpoint (plugins.updater.endpoints
# in tauri.conf.json points at this release's latest.json URL), verify the
# minisign signature against the embedded pubkey, and self-update.
#
# The battery does NOT gate this job: pushes to main already run it on
# every commit, and the tag points at a commit whose battery result is
# known. If the battery is red, don't tag.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.0.1-rc2)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve release version from the tag
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Node (>=26 for node:sqlite)
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Pin node at /usr/local/bin/node (make-installer.sh hardcodes it)
        run: |
          set -euo pipefail
          NODE_BIN="$(command -v node)"
          sudo mkdir -p /usr/local/bin
          if [ -e /usr/local/bin/node ] && [ ! -L /usr/local/bin/node ]; then
            sudo mv /usr/local/bin/node /usr/local/bin/node.pre-daisy
          fi
          sudo ln -sf "$NODE_BIN" /usr/local/bin/node

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install dashboard deps
        run: |
          cd ui
          npm ci --no-audit --no-fund

      # The updater signature is REQUIRED for a release: a release whose
      # updater artifacts are unsigned would break the updater promise the
      # app makes. Fail loudly if the secret is missing.
      - name: Require updater signing key
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "✗ TAURI_SIGNING_PRIVATE_KEY secret is not set — refusing to ship an unsigned release." >&2
            echo "  Add it (base64 of the minisign key) in Settings → Secrets → Actions." >&2
            exit 1
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build installer (universal; stages 1–4, stage 5 skipped headless)
        run: NO_APP_VERIFY=1 TAURI_UNIVERSAL=1 ./make-installer.sh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Locate bundle directory (universal vs native)
        run: |
          set -euo pipefail
          B=src-tauri/target/release/bundle
          [ -d "$B" ] || B=src-tauri/target/universal-apple-darwin/release/bundle
          ls "$B/macos" "$B/dmg" 2>/dev/null || { echo "no bundle found under $B" >&2; exit 1; }
          echo "BUNDLE=$B" >> "$GITHUB_ENV"

        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify updater signature against the embedded pubkey
        run: |
          set -euo pipefail
          node - <<'EOF'
          const fs = require('fs'), crypto = require('crypto');
          function b64d(s){ s = s.replace(/\s+/g,''); return Buffer.from(s, 'base64'); }
          const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          // conf pubkey = base64(minisign pub FILE); the file's body line is base64(2-byte alg + 8-byte keyid + 32-byte key)
          const pubFileText = b64d(conf.plugins.updater.pubkey).toString();
          const pubBodyLine = pubFileText.split('\n').filter(l => l && !l.startsWith('untrusted'))[0];
          const pubBody = b64d(pubBodyLine);
          const key = crypto.createPublicKey({
            key: Buffer.concat([Buffer.from('302a300506032b6570032100','hex'), pubBody.slice(10)]),
            format: 'der', type: 'spki',
          });
          const tar = fs.readFileSync(process.env.BUNDLE + '/macos/Daisy Cluster.app.tar.gz');
          const sigFileText = fs.readFileSync(process.env.BUNDLE + '/macos/Daisy Cluster.app.tar.gz.sig', 'utf8');
          // the .sig file is ALSO base64(minisign sig FILE) — unwrap both layers
          const sigFileTextDecoded = b64d(sigFileText).toString();
          const sigBodyLine = sigFileTextDecoded.split('\n').filter(l => l && !l.startsWith('untrusted'))[0];
          const sigBody = b64d(sigBodyLine);
          if (!sigBody.slice(2,10).equals(pubBody.slice(2,10))) {
            console.error('✗ key id mismatch'); process.exit(1);
          }
          const blake = crypto.createHash('blake2b512').update(tar).digest();
          const ok = crypto.verify(null, blake, key, sigBody.slice(10));
          if (!ok) { console.error('✗ updater signature INVALID'); process.exit(1); }
          console.log('✓ updater signature valid against the embedded pubkey');
          EOF

      - name: Generate latest.json (Tauri updater feed)
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          SIG=$(base64 < "$BUNDLE/macos/Daisy Cluster.app.tar.gz.sig" | tr -d '\n')
          python3 - "$VERSION" "$BASE" "$SIG" <<'EOF'
          import json, sys
          version, base, sig = sys.argv[1], sys.argv[2], sys.argv[3]
          pub = json.load(open('src-tauri/tauri.conf.json'))['plugins']['updater']['pubkey']
          feed = {
            "version": version,
            "notes": f"Daisy Cluster {version}",
            "pub_date": __import__('datetime').datetime.now(__import__('datetime').timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
            "platforms": {
              "darwin-aarch64": {
                "signature": sig,
                "url": f"{base}/Daisy.Cluster.app.tar.gz",
              },
            },
          }
          json.dump(feed, open('latest.json', 'w'), indent=2)
          print(json.dumps(feed, indent=2))
          EOF
          shasum -a 256 \
            $BUNDLE/dmg/*.dmg \
            "$BUNDLE/macos/Daisy Cluster.app.tar.gz" \
            > SHA256SUMS.txt

      - name: Rename artifacts for the release (no spaces)
        run: |
          set -euo pipefail
          cd "$BUNDLE"
          # The DMG is named with the app version from tauri.conf.json (0.1.0),
          # which may differ from the release tag — glob the real file.
          DMG=$(ls dmg/*.dmg)
          cp "$DMG" "Daisy.Cluster_${VERSION}_aarch64.dmg"
          cp "macos/Daisy Cluster.app.tar.gz" "Daisy.Cluster.app.tar.gz"
          cp "macos/Daisy Cluster.app.tar.gz.sig" "Daisy.Cluster.app.tar.gz.sig"

      - name: Attach everything to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Daisy Cluster ${{ env.TAG }}
          draft: false
          prerelease: ${{ contains(env.TAG, '-') }}
          fail_on_unmatched_files: true
          files: |
            ${{ env.BUNDLE }}/Daisy.Cluster_*_aarch64.dmg
            ${{ env.BUNDLE }}/Daisy.Cluster.app.tar.gz
            ${{ env.BUNDLE }}/Daisy.Cluster.app.tar.gz.sig
            latest.json
            SHA256SUMS.txt

  # ─── Release smoke test ───────────────────────────────────────────────────
  # The rc1–rc3 smoke tests each caught a real shipping bug (arm64-only build,
  # unsealed bundle, stale pre-sign DMG). This job makes those checks part of
  # every release: it re-downloads the artifacts from the PUBLISHED release
  # URL — not the local build dir — so it validates what a recipient actually
  # gets, including the upload itself.
  smoke-test:
    runs-on: macos-14
    needs: release
    timeout-minutes: 10
    steps:
      - name: Resolve release tag
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download the published artifacts (as a recipient would)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir published && cd published
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          for f in Daisy.Cluster_*_aarch64.dmg Daisy.Cluster.app.tar.gz \
                   Daisy.Cluster.app.tar.gz.sig latest.json SHA256SUMS.txt; do
            curl -sSL -f -H "Authorization: Bearer ${GH_TOKEN}" -O "$BASE/$f"
          done
          ls -la

      - name: Verify SHA256SUMS matches the published files
        run: |
          set -euo pipefail
          cd published
          # SHA256SUMS entries carry build-dir paths; compare digests, not names.
          python3 - <<'EOF'
          import hashlib, re, sys
          expected = {}
          for line in open('SHA256SUMS.txt'):
              digest, path = line.split(maxsplit=1)
              expected[path.strip()] = digest
          def sha(p):
              h = hashlib.sha256()
              with open(p, 'rb') as f:
                  for chunk in iter(lambda: f.read(1 << 20), b''):
                      h.update(chunk)
              return h.hexdigest()
          got = {
              'dmg': sha(next(p for p in __import__('glob').glob('Daisy.Cluster_*_aarch64.dmg'))),
              'tar': sha('Daisy.Cluster.app.tar.gz'),
          }
          want_dmg = next(d for p, d in expected.items() if p.endswith('.dmg'))
          want_tar = next(d for p, d in expected.items() if p.endswith('app.tar.gz'))
          ok = got['dmg'] == want_dmg and got['tar'] == want_tar
          print(f"dmg sha256 {'✓' if got['dmg'] == want_dmg else '✗ MISMATCH'}")
          print(f"tar sha256 {'✓' if got['tar'] == want_tar else '✗ MISMATCH'}")
          sys.exit(0 if ok else 1)
          EOF

      - name: Mount DMG and verify the app seal under quarantine
        run: |
          set -euo pipefail
          cd published
          DMG=$(ls Daisy.Cluster_*_aarch64.dmg)
          hdiutil attach "$DMG" -nobrowse -quiet
          APP="/Volumes/Daisy Cluster/Daisy Cluster.app"
          cp -R "$APP" ./smoke.app
          hdiutil detach "/Volumes/Daisy Cluster" -quiet
          # Simulate a browser download so Gatekeeper's path is exercised.
          xattr -w com.apple.quarantine "0081;00000000;GitHub Actions;" smoke.app
          # The seal: exactly the check the rc1/rc2 DMGs failed.
          codesign --verify --strict smoke.app
          test -d smoke.app/Contents/_CodeSignature
          echo "✓ published DMG app is sealed and strict-verifies under quarantine"

      - name: Verify universal binary (x86_64 + arm64)
        run: |
          set -euo pipefail
          cd published
          ARCHS=$(lipo -archs smoke.app/Contents/MacOS/daisy-cluster)
          echo "architectures: $ARCHS"
          echo "$ARCHS" | grep -qw x86_64
          echo "$ARCHS" | grep -qw arm64
          echo "✓ universal binary confirmed"

      - name: Verify latest.json signature matches the published tarball
        run: |
          set -euo pipefail
          cd published
          python3 - <<'EOF'
          import base64, hashlib, json, sys
          feed = json.load(open('latest.json'))
          plat = feed['platforms']['darwin-aarch64']
          assert 'Daisy.Cluster.app.tar.gz' in plat['url'], f"feed URL wrong: {plat['url']}"
          # Tauri .sig == base64(minisign text); feed carries the same base64.
          sig_file = base64.b64encode(open('Daisy.Cluster.app.tar.gz.sig','rb').read()).decode()
          assert plat['signature'] == sig_file, 'feed signature does not match published .sig'
          # And the tarball the feed points at must be the one signed.
          import hashlib
          digest = hashlib.sha256(open('Daisy.Cluster.app.tar.gz','rb').read()).hexdigest()
          sums = open('SHA256SUMS.txt').read()
          assert digest in sums, 'published tarball not covered by SHA256SUMS'
          print(f"✓ feed version {feed['version']} — signature + URL + digest consistent")
          EOF

